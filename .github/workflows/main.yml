name: ChanelTeam LGL Build

on:
  workflow_dispatch: 

jobs:
  build:
    name: Build LGL Mod Menu
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn về máy chủ
        uses: actions/checkout@v4

      - name: Cài đặt môi trường Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cài Gradle 8.13 thủ công
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip -O gradle.zip
          unzip -q gradle.zip
          sudo mv gradle-8.13 /opt/gradle-8.13
          /opt/gradle-8.13/bin/gradle wrapper --gradle-version 8.13
          chmod +x ./gradlew

      - name: Nổi Lửa Lò Bát Quái (Đang Build...)
        run: ./gradlew assembleRelease --no-daemon

      - name: Đóng gói Đan Dược (Tạo file tải về)
        uses: actions/upload-artifact@v4
        with:
          name: ChanelTeam_Mod_APK
          path: app/build/outputs/apk/release/*.apk
